<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>k6 Web Runner</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --text: #1d2330; --muted: #667085;
    --border: #d9dde5; --accent: #7d64ff; --accent-text: #fff;
    --ok: #12805c; --warn: #b54708; --err: #c01048; --run: #1f6feb;
    --out-bg: #0f1420; --out-text: #d6deeb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8b949e;
      --border: #30363d; --accent: #8f7bff;
      --ok: #3fb950; --warn: #d29922; --err: #f85149; --run: #58a6ff;
      --out-bg: #010409;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px; margin-bottom: 16px;
  }
  form { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .hint { font-weight: 400; color: var(--muted); }
  input {
    width: 100%; padding: 9px 10px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .actions { display: flex; gap: 10px; }
  button {
    padding: 10px 20px; font: inherit; font-weight: 600; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .summary { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.3fr; gap: 12px; }
  .summary div span { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .summary div strong { display: block; overflow-wrap: anywhere; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; color: #fff; background: var(--muted); }
  .badge.running { background: var(--run); }
  .badge.passed { background: var(--ok); }
  .badge.thresholds { background: var(--warn); }
  .badge.failed { background: var(--err); }
  .error {
    display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 8px;
    border: 1px solid var(--err); color: var(--err); background: var(--panel); font-weight: 600;
  }
  .error.show { display: block; }
  pre {
    margin: 0; padding: 14px; min-height: 240px; max-height: 60vh; overflow: auto;
    background: var(--out-bg); color: var(--out-text); border-radius: 8px;
    font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  @media (max-width: 720px) {
    form { grid-template-columns: 1fr 1fr; }
    .summary { grid-template-columns: 1fr 1fr; }
    .summary div:first-child { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<main>
  <h1>k6 Web Runner</h1>
  <p class="sub">Configure a load test, run it with k6 and watch the output live.</p>

  <section class="panel">
    <form id="form">
      <div class="full">
        <label for="url">Target URL</label>
        <input id="url" required placeholder="https://example.com">
      </div>
      <div>
        <label for="vus">Virtual users</label>
        <input id="vus" type="number" min="1" step="1" required value="10">
      </div>
      <div>
        <label for="duration">Duration <span class="hint">30s, 2m, 1m30s</span></label>
        <input id="duration" required value="30s">
      </div>
      <div>
        <label for="p95">p95 limit <span class="hint">ms</span></label>
        <input id="p95" type="number" min="1" step="1" required value="500">
      </div>
      <div>
        <label for="fail">Max failure rate <span class="hint">%</span></label>
        <input id="fail" type="number" min="0.01" max="100" step="0.01" required value="2">
      </div>
      <div class="full actions">
        <button type="submit" class="primary" id="run">Run Test</button>
        <button type="button" id="stop" disabled>Stop</button>
      </div>
    </form>
  </section>

  <div class="error" id="error"></div>

  <section class="panel summary">
    <div><span>Target</span><strong id="s-target">—</strong></div>
    <div><span>VUs</span><strong id="s-vus">—</strong></div>
    <div><span>Duration</span><strong id="s-duration">—</strong></div>
    <div><span>Elapsed</span><strong id="s-elapsed">—</strong></div>
    <div><span>Status</span><strong><span class="badge" id="s-status">idle</span></strong></div>
  </section>

  <section class="panel">
    <pre id="output">No test run yet.</pre>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const form = $('form'), runBtn = $('run'), stopBtn = $('stop');
const output = $('output'), errorBox = $('error');
let controller = null, timer = null;

function setStatus(text, cls) {
  const b = $('s-status');
  b.textContent = text;
  b.className = 'badge ' + (cls || '');
}

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.toggle('show', !!msg);
}

function append(text) {
  const atBottom = output.scrollTop + output.clientHeight >= output.scrollHeight - 20;
  output.textContent += text;
  if (atBottom) output.scrollTop = output.scrollHeight;
}

function startTimer() {
  const start = Date.now();
  const tick = () => {
    const s = Math.floor((Date.now() - start) / 1000);
    $('s-elapsed').textContent = Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
  };
  tick();
  timer = setInterval(tick, 1000);
}

function finish(result) {
  clearInterval(timer);
  controller = null;
  runBtn.disabled = false;
  stopBtn.disabled = true;
  if (!result) return;
  if (result.success) {
    setStatus('completed — thresholds passed', 'passed');
  } else if (result.thresholds_failed) {
    setStatus('completed — thresholds failed', 'thresholds');
    showError('The test ran, but the target did not meet the p95 or failure-rate limits (k6 exit code 99).');
  } else {
    setStatus('failed', 'failed');
    showError(result.error || ('k6 exited with code ' + result.exit_code));
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  showError('');

  const payload = {
    url: $('url').value.trim(),
    vus: parseInt($('vus').value, 10),
    duration: $('duration').value.trim(),
    p95_ms: parseInt($('p95').value, 10),
    max_failure_rate: Number((parseFloat($('fail').value) / 100).toFixed(6)),
  };

  $('s-target').textContent = payload.url;
  $('s-vus').textContent = payload.vus;
  $('s-duration').textContent = payload.duration;
  $('s-elapsed').textContent = '—';
  output.textContent = '';
  setStatus('running', 'running');
  runBtn.disabled = true;
  stopBtn.disabled = false;
  controller = new AbortController();

  let result = null;
  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal,
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || ('HTTP ' + res.status));
    }

    startTimer();
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i);
        buf = buf.slice(i + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'output') append(ev.text);
        else if (ev.type === 'result') result = ev.result;
      }
    }
    if (!result) throw new Error('Connection closed before the test finished.');
    finish(result);
  } catch (err) {
    finish(null);
    if (err.name === 'AbortError') {
      setStatus('stopped', 'failed');
      showError('Test stopped by user.');
    } else {
      setStatus('failed', 'failed');
      showError(err.message);
    }
  }
});

stopBtn.addEventListener('click', () => {
  if (controller) controller.abort();
});
</script>
</body>
</html>
